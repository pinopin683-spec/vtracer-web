<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Susun Kata - 1000 Level</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.45)), 
                              url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=85');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="text-white font-sans flex flex-col justify-between h-screen p-4 max-w-md mx-auto">

    <!-- Audio Musik Latar Belakang -->
    <audio id="bg-music" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
    </audio>

    <!-- Header Atas: Login Email, Info Level, Koin, & Musik -->
    <div class="flex flex-col gap-2 bg-black/80 backdrop-blur-md p-3.5 rounded-2xl border border-gray-700 shadow-xl">
        
        <!-- Menu Login Email (Paling Atas) -->
        <div id="login-container" class="flex items-center gap-2 bg-zinc-900/90 px-3 py-1.5 rounded-xl border border-gray-700 text-xs">
            <span id="user-status" class="truncate flex-1 text-gray-300">👤 Belum Login</span>
            <button onclick="prosesLogin()" id="btn-login-logout" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1 rounded-lg font-bold transition">Login</button>
        </div>

        <div class="flex justify-between items-center">
            <span id="level-text" class="text-sm font-bold text-rose-400">Level Rahasia</span>
            <div class="flex items-center gap-2">
                <!-- Tombol Musik On/Off -->
                <button onclick="toggleMusik()" id="btn-musik" class="bg-zinc-900 hover:bg-zinc-800 px-2.5 py-1 rounded-full text-xs border border-gray-700 transition">
                    🔇 Musik
                </button>
                <div class="flex items-center gap-1.5 bg-zinc-900 px-3 py-1 rounded-full border border-gray-700">
                    <span>🪙</span>
                    <span id="coin-text" class="text-sm font-bold">120 / 1000</span>
                </div>
            </div>
        </div>

        <!-- Tombol WD DANA & Riwayat -->
        <div class="flex gap-2">
            <button onclick="tarikSaldoDana()" class="flex-1 bg-zinc-900 hover:bg-zinc-800 text-blue-400 font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-1.5 border border-blue-500/30 shadow">
                <span>💸 Tukar DANA (Min. 1000)</span>
            </button>
            <button onclick="lihatRiwayatWD()" class="bg-zinc-900 hover:bg-zinc-800 text-amber-400 font-bold px-3 py-2.5 rounded-xl text-xs transition border border-amber-500/30 shadow">
                📋 Riwayat WD
            </button>
        </div>
    </div>

    <!-- Area Permainan Susun Kata -->
    <div class="flex flex-col items-center justify-center my-auto w-full">
        <h2 class="text-xs font-bold mb-4 text-white tracking-widest uppercase drop-shadow-md bg-black/50 px-4 py-1 rounded-full">SUSUN HURUF ACAK</h2>
        
        <!-- Kotak Tempat Jawaban -->
        <div id="answer-box" class="flex gap-2 mb-8 min-h-[60px] items-center justify-center">
            <!-- Slot jawaban terisi otomatis -->
        </div>

        <!-- Pilihan Huruf Acak -->
        <div id="letter-pool" class="flex flex-wrap gap-3 justify-center max-w-xs">
            <!-- Tombol huruf muncul di sini -->
        </div>
    </div>

    <!-- Tombol Kontrol Bawah -->
    <div class="space-y-2 mb-2">
        <button onclick="cekJawaban()" class="w-full bg-rose-600 hover:bg-rose-700 font-bold py-3 rounded-2xl transition shadow-xl text-white tracking-wide">
            Periksa Jawaban
        </button>
        
        <!-- Tombol Bantuan Petunjuk (+20 Koin) -->
        <button id="btn-bantuan" onclick="bukaBantuan()" class="w-full bg-black/90 hover:bg-black border border-gray-700 text-amber-400 font-semibold py-2.5 rounded-2xl text-sm transition backdrop-blur-md shadow-lg flex items-center justify-center gap-2">
            <span>💡</span> <span id="text-bantuan">Buka Petunjuk (+20 Koin)</span>
        </button>

        <!-- Tombol Link Afiliasi Harian -->
        <button id="btn-afiliasi" onclick="klaimAfiliasi()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-700 hover:from-emerald-500 hover:to-teal-600 border border-emerald-500/40 text-white font-bold py-2.5 rounded-2xl text-xs transition shadow-lg flex items-center justify-center gap-2">
            <span>🔥</span> <span>Klaim Bonus Afiliasi Hari Ini (+100 Koin)</span>
        </button>
    </div>

    <!-- Skrip Logika Game -->
    <script>
        let currentLevel = parseInt(localStorage.getItem('game_level')) || 1;
        let koinHariIni = parseInt(localStorage.getItem('daily_coins')) || 120;
        let userEmail = localStorage.getItem('user_email') || '';
        let cooldownWaktu = 0; 
        let timerInterval = null;
        let isMusikPlaying = false;
        
        const gamePool = [
            { soal: "KATA", acak: ["T", "A", "K", "A"] },
            { soal: "BUKU", acak: ["U", "K", "B", "U"] },
            { soal: "PIZZA", acak: ["Z", "A", "P", "Z", "I"] },
            { soal: "KODE", acak: ["E", "D", "O", "K"] },
            { soal: "GAME", acak: ["M", "A", "E", "G"] },
            { soal: "PANTAI", acak: ["I", "A", "T", "N", "A", "P"] },
            { soal: "KASUR", acak: ["R", "U", "S", "A", "K"] },
            { soal: "LAMPU", acak: ["U", "P", "M", "A", "L"] }
        ];

        let currentData = {};
        let selectedLetters = [];

        function updateUI() {
            document.getElementById('coin-text').innerText = `${koinHariIni} / 1000`;
            document.getElementById('level-text').innerText = `Tahap Misteri (${currentLevel}/1000)`;
            
            let statusText = document.getElementById('user-status');
            let btnAuth = document.getElementById('btn-login-logout');
            if (userEmail) {
                statusText.innerText = `✉️ ${userEmail}`;
                btnAuth.innerText = "Logout";
                btnAuth.className = "bg-zinc-700 hover:bg-zinc-600 text-white px-3 py-1 rounded-lg font-bold transition";
            } else {
                statusText.innerText = `👤 Belum Login`;
                btnAuth.innerText = "Login";
                btnAuth.className = "bg-rose-600 hover:bg-rose-700 text-white px-3 py-1 rounded-lg font-bold transition";
            }
        }

        // Fungsi Login Terhubung ke Server Ubuntu Termux
        async function prosesLogin() {
            if (userEmail) {
                if (confirm("Apakah kamu ingin keluar (logout) dari akun ini?")) {
                    localStorage.removeItem('user_email');
                    userEmail = '';
                    updateUI();
                    alert("✅ Berhasil keluar akun.");
                }
            } else {
                let inputEmail = prompt("Masukkan alamat Email kamu untuk mulai bermain & menyimpan progres:");
                if (inputEmail && inputEmail.includes("@")) {
                    userEmail = inputEmail.trim();
                    localStorage.setItem('user_email', userEmail);
                    
                    // Sinkronisasi ke backend server Ubuntu
                    await prosesLoginServer(userEmail);
                    
                    updateUI();
                } else if (inputEmail) {
                    alert("⚠️ Format email tidak valid!");
                }
            }
        }

        // Fungsi Fetch API ke Server Backend Ubuntu
        async function prosesLoginServer(emailInput) {
            try {
                let response = await fetch('http://192.168.8.100:8080/api.php?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput })
                });
                let result = await response.json();
                if (result.status === 'success') {
                    console.log("Data player disinkronkan ke server:", result.data);
                    koinHariIni = result.data.coins;
                    currentLevel = result.data.current_level;
                    updateUI();
                }
            } catch (error) {
                console.error("Gagal terhubung ke server backend:", error);
            }
        }

        function loadLevel() {
            if (currentLevel > 1000) {
                alert("🏆 Luar biasa! Kamu telah menamatkan 1000 Tahap. Permainan direset ulang dari awal.");
                currentLevel = 1;
            }

            let index = (currentLevel - 1) % gamePool.length;
            currentData = gamePool[index];
            selectedLetters = [];

            updateUI();
            renderPool();
            renderAnswerBox();
            cekStatusAfiliasiHarian();
        }

        function renderPool() {
            const poolDiv = document.getElementById('letter-pool');
            poolDiv.innerHTML = '';
            
            currentData.acak.forEach((huruf, idx) => {
                let btn = document.createElement('button');
                btn.innerText = huruf;
                btn.className = "w-12 h-12 bg-black/85 backdrop-blur-md border border-gray-700 hover:border-rose-500 rounded-2xl font-bold text-lg text-white shadow-xl transition flex items-center justify-center";
                btn.onclick = () => pilihHuruf(huruf, idx, btn);
                poolDiv.appendChild(btn);
            });
        }

        function renderAnswerBox() {
            const answerDiv = document.getElementById('answer-box');
            answerDiv.innerHTML = '';

            for (let i = 0; i < currentData.soal.length; i++) {
                let slot = document.createElement('div');
                slot.className = "w-12 h-12 bg-black/85 backdrop-blur-md border-2 border-dashed border-gray-600 rounded-2xl flex items-center justify-center font-bold text-lg text-rose-400 shadow-inner";
                slot.innerText = selectedLetters[i] || '';
                answerDiv.appendChild(slot);
            }
        }

        function pilihHuruf(huruf, idx, btnElement) {
            if (selectedLetters.length < currentData.soal.length) {
                selectedLetters.push(huruf);
                btnElement.style.opacity = '0.3';
                btnElement.disabled = true;
                renderAnswerBox();
            }
        }

        function cekJawaban() {
            let jawabanUser = selectedLetters.join('');
            if (jawabanUser === currentData.soal) {
                alert("🎉 Benar! Tahap terlewati, koin bertambah.");
                
                if (koinHariIni < 1000) {
                    koinHariIni += 20;
                    localStorage.setItem('daily_coins', koinHariIni);
                }

                currentLevel++;
                localStorage.setItem('game_level', currentLevel);
                loadLevel();
            } else {
                alert("❌ Susunan kata masih salah. Ayo coba lagi!");
                loadLevel();
            }
        }

        setInterval(() => {
            if (window.AndroidInterface && typeof window.AndroidInterface.showInterstitialAd === 'function') {
                window.AndroidInterface.showInterstitialAd();
            } else {
                console.log("Simulasi Timer 3 Menit: Iklan Interstitial dipicu otomatis.");
            }
        }, 180000);

        const WAKTU_24_JAM = 24 * 60 * 60 * 1000;

        function cekStatusAfiliasiHarian() {
            let terakhirKlaim = localStorage.getItem('last_affiliate_claim');
            let waktuSekarang = new Date().getTime();
            let btnAfiliasi = document.getElementById('btn-afiliasi');

            if (terakhirKlaim && (waktuSekarang - terakhirKlaim < WAKTU_24_JAM)) {
                btnAfiliasi.style.display = 'none';
            } else {
                btnAfiliasi.style.display = 'flex';
            }
        }

        function klaimAfiliasi() {
            let terakhirKlaim = localStorage.getItem('last_affiliate_claim');
            let waktuSekarang = new Date().getTime();

            if (terakhirKlaim && (waktuSekarang - terakhirKlaim < WAKTU_24_JAM)) {
                alert("⚠️ Bonus afiliasi hari ini sudah diklaim!");
                return;
            }

            let linkAffiliasi = "https://shopee.co.id/universal-link/your-affiliate-id"; 
            window.open(linkAffiliasi, '_blank');

            if (koinHariIni < 1000) {
                koinHariIni += 100;
                localStorage.setItem('daily_coins', koinHariIni);
            }

            localStorage.setItem('last_affiliate_claim', waktuSekarang);
            alert("✅ Selamat! Kamu mendapatkan bonus +100 Koin.");
            
            updateUI();
            cekStatusAfiliasiHarian();
        }

        function bukaBantuan() {
            if (cooldownWaktu > 0) {
                alert(`⏳ Petunjuk masih dikunci! Tunggu ${Math.ceil(cooldownWaktu / 60)} menit lagi.`);
                return;
            }

            let hurufPertama = currentData.soal[0];
            alert(`💡 Petunjuk: Huruf awal adalah "${hurufPertama}"\n🎁 Bonus +20 Koin ditambahkan!`);

            if (koinHariIni < 1000) {
                koinHariIni += 20;
                localStorage.setItem('daily_coins', koinHariIni);
                updateUI();
            }

            cooldownWaktu = 300; 
            mulaiTimerBantuan();
        }

        function mulaiTimerBantuan() {
            let btnText = document.getElementById('text-bantuan');
            let btnBantuan = document.getElementById('btn-bantuan');
            
            clearInterval(timerInterval);
            btnBantuan.style.opacity = '0.6';

            timerInterval = setInterval(() => {
                cooldownWaktu--;
                let menit = Math.floor(cooldownWaktu / 60);
                let detik = cooldownWaktu % 60;
                btnText.innerText = `Tunggu Bantuan (${menit}:${detik < 10 ? '0' : ''}${detik})`;

                if (cooldownWaktu <= 0) {
                    clearInterval(timerInterval);
                    btnText.innerText = "💡 Buka Petunjuk (+20 Koin)";
                    btnBantuan.style.opacity = '1';
                }
            }, 1000);
        }

        function toggleMusik() {
            let audio = document.getElementById('bg-music');
            let btnMusik = document.getElementById('btn-musik');

            if (isMusikPlaying) {
                audio.pause();
                isMusikPlaying = false;
                btnMusik.innerText = "🔇 Musik";
            } else {
                audio.play().catch(e => console.log("Audio diblokir browser."));
                isMusikPlaying = true;
                btnMusik.innerText = "🔊 Musik On";
            }
        }

        function tarikSaldoDana() {
            if (!userEmail) {
                alert("⚠️ Silakan Login dengan Email kamu terlebih dahulu!");
                return;
            }

            if (koinHariIni < 1000) {
                alert("⚠️ Koin belum cukup! Minimal 1.000 koin untuk penarikan ke DANA.");
            } else {
                let nomorDana = prompt("Masukkan nomor akun DANA kamu (contoh: 08123456789):");
                if (nomorDana) {
                    let tanggalWd = new Date().toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" });
                    
                    let riwayatList = JSON.parse(localStorage.getItem('wd_history')) || [];
                    riwayatList.unshift({
                        email: userEmail,
                        nomor: nomorDana,
                        nominal: "Rp1.000 (1000 Koin)",
                        waktu: tanggalWd,
                        status: "Diproses Admin"
                    });
                    localStorage.setItem('wd_history', JSON.stringify(riwayatList));

                    alert(`✅ Permintaan penarikan ke DANA (${nomorDana}) berhasil dikirim!`);
                    koinHariIni -= 1000;
                    localStorage.setItem('daily_coins', koinHariIni);
                    updateUI();
                }
            }
        }

        function lihatRiwayatWD() {
            let riwayatList = JSON.parse(localStorage.getItem('wd_history')) || [];
            if (riwayatList.length === 0) {
                alert("📋 Belum ada riwayat penarikan saldo DANA.");
            } else {
                let pesan = "📋 RIWAYAT PENARIKAN DANA:\n\n";
                riwayatList.forEach((item, idx) => {
                    pesan += `${idx + 1}. ${item.nominal}\n   No: ${item.nomor} (${item.status})\n   Waktu: ${item.waktu}\n\n`;
                });
                alert(pesan);
            }
        }

        window.onload = loadLevel;
    </script>
</body>
</html>
